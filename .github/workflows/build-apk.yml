name: Gerar APK Android

on:
  push:
    branches: [ "principal" ]
  workflow_dispatch: # Permite rodar manualmente por um botão

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Dar permissão ao Gradle
        run: chmod +x gradlew

      - name: Compilar APK de Debug
        run: ./gradlew assembleDebug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: STREAMGO-debug-apk
          path: aplicativo/build/outputs/apk/debug/*.apk
